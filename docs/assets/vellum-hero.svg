<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Vellum Launcher</title>
  <desc id="desc">A dark violet and blue banner with Vellum's folded V symbol and a launcher phone mockup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090b12"/><stop offset=".55" stop-color="#171126"/><stop offset="1" stop-color="#07121d"/></linearGradient>
    <radialGradient id="bloom" cx="73%" cy="14%" r="66%"><stop offset="0" stop-color="#9c83ff" stop-opacity=".62"/><stop offset=".34" stop-color="#348fff" stop-opacity=".20"/><stop offset="1" stop-color="#0b0d16" stop-opacity="0"/></radialGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b49bff"/><stop offset="1" stop-color="#66a2ff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#000" flood-opacity=".44"/></filter>
  </defs>
  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="34" fill="url(#bloom)"/>
  <circle cx="930" cy="72" r="160" fill="#765dff" opacity=".16" filter="url(#blur)"/>
  <g transform="translate(90 94)">
    <text x="0" y="16" fill="#d6cbff" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="8">VELLUM</text>
    <text x="0" y="105" fill="#fff" font-family="Arial, sans-serif" font-size="58" letter-spacing="-2">Home, with</text>
    <text x="0" y="166" fill="#fff" font-family="Arial, sans-serif" font-size="58" letter-spacing="-2">atmosphere.</text>
    <text x="2" y="216" fill="#d5d3df" font-family="Arial, sans-serif" font-size="19">Quiet design. Fluid motion. Serious launcher power.</text>
    <g transform="translate(0 257)">
      <rect width="170" height="44" rx="22" fill="#fff" opacity=".08" stroke="#fff" stroke-opacity=".16"/><text x="85" y="28" text-anchor="middle" fill="#d8ccff" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">LIGHT-REACTIVE</text>
      <rect x="182" width="128" height="44" rx="22" fill="#fff" opacity=".08" stroke="#fff" stroke-opacity=".16"/><text x="246" y="28" text-anchor="middle" fill="#fff" opacity=".82" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">PRIVATE</text>
      <rect x="322" width="146" height="44" rx="22" fill="#fff" opacity=".08" stroke="#fff" stroke-opacity=".16"/><text x="395" y="28" text-anchor="middle" fill="#fff" opacity=".82" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">PIXEL-FAST</text>
    </g>
  </g>
  <g transform="translate(785 42)" filter="url(#shadow)">
    <rect width="292" height="458" rx="50" fill="#080a10" stroke="#fff" stroke-opacity=".20"/><rect x="12" y="12" width="268" height="434" rx="40" fill="url(#bg)"/>
    <circle cx="219" cy="67" r="34" fill="#080b12" fill-opacity=".38" stroke="url(#button)" stroke-width="2"/><path d="M207 59l12 20 13-23" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="101" fill="#fff" opacity=".92" font-family="Arial, sans-serif" font-size="31">09:41</text><text x="35" y="127" fill="#fff" opacity=".56" font-family="Arial, sans-serif" font-size="12" letter-spacing="1">SUNDAY, AUGUST 30</text>
    <g fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".12"><rect x="34" y="175" width="48" height="48" rx="15"/><rect x="96" y="175" width="48" height="48" rx="15"/><rect x="158" y="175" width="48" height="48" rx="15"/><rect x="220" y="175" width="48" height="48" rx="15"/><rect x="34" y="248" width="48" height="48" rx="15"/><rect x="96" y="248" width="48" height="48" rx="15"/><rect x="158" y="248" width="48" height="48" rx="15"/><rect x="220" y="248" width="48" height="48" rx="15"/></g>
    <g fill="url(#button)"><circle cx="58" cy="199" r="11"/><circle cx="120" cy="199" r="11"/><circle cx="182" cy="199" r="11"/><circle cx="244" cy="199" r="11"/></g>
    <rect x="30" y="354" width="232" height="67" rx="30" fill="#fff" fill-opacity=".09" stroke="#fff" stroke-opacity=".12"/><circle cx="70" cy="387" r="19" fill="#aa91ff"/><circle cx="120" cy="387" r="19" fill="#76a8ff"/><circle cx="170" cy="387" r="19" fill="#c7b9ff"/><circle cx="220" cy="387" r="19" fill="#8e75f1"/><line x1="25" y1="147" x2="25" y2="316" stroke="#9c83ff" stroke-opacity=".25"/>
  </g>
  <g transform="translate(665 72)"><circle r="55" fill="#0b0d16" stroke="#fff" stroke-opacity=".13"/><circle r="43" fill="#9c83ff" opacity=".20"/><path d="M-27-26L0 23-10 35-36-13Z" fill="#ae94ff"/><path d="M0 23L24-29 36-14 9 36Z" fill="#65a5ff"/><path d="M-10 35L0 23 9 36 0 44Z" fill="#e8e2ff"/></g>
</svg>
